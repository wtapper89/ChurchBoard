name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Check browser JavaScript
        run: |
          node --check app/static/common.js
          node --check app/static/display.js
          node --check app/static/editor.js
          node --check app/static/module-settings.js
          node --check app/static/modules.js
          node --check app/static/desktop.js
          node --check app/static/login.js
          node --check app/static/producer.js
