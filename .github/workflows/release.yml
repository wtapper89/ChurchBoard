name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  LIVEKIT_VERSION: v1.13.5

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build hosted intercom engine
        run: |
          git clone --depth 1 --branch "$LIVEKIT_VERSION" https://github.com/livekit/livekit.git "$RUNNER_TEMP/livekit"
          go -C "$RUNNER_TEMP/livekit" build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/livekit-server" ./cmd/server
          echo "CHURCHBOARD_LIVEKIT_SERVER_PATH=$RUNNER_TEMP/livekit-server" >> "$GITHUB_ENV"
      - run: chmod +x installers/macos/build.sh "installers/macos/Uninstall ChurchBoard.command"
      - run: PYTHON=python3 installers/macos/build.sh
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - uses: actions/upload-artifact@v6
        with:
          name: ChurchBoard-${{ matrix.runner }}
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build hosted intercom engine
        shell: powershell
        run: |
          git clone --depth 1 --branch $env:LIVEKIT_VERSION https://github.com/livekit/livekit.git "$env:RUNNER_TEMP\livekit"
          go -C "$env:RUNNER_TEMP\livekit" build -trimpath -ldflags="-s -w" -o "$env:RUNNER_TEMP\livekit-server.exe" ./cmd/server
          "CHURCHBOARD_LIVEKIT_SERVER_PATH=$env:RUNNER_TEMP\livekit-server.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: choco install innosetup -y --no-progress
      - shell: powershell
        run: ./installers/windows/Build-Windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: ChurchBoard-Windows
          path: dist/*Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build hosted intercom engine
        run: |
          git clone --depth 1 --branch "$LIVEKIT_VERSION" https://github.com/livekit/livekit.git "$RUNNER_TEMP/livekit"
          go -C "$RUNNER_TEMP/livekit" build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/livekit-server" ./cmd/server
          echo "CHURCHBOARD_LIVEKIT_SERVER_PATH=$RUNNER_TEMP/livekit-server" >> "$GITHUB_ENV"
      - run: chmod +x installers/linux/*.sh installers/linux/debian/*
      - run: PYTHON=python3 installers/linux/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: ChurchBoard-Linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
