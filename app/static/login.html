<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in · ChurchBoard</title><link rel="icon" href="/static/churchboard-icon.png"><link rel="stylesheet" href="/static/style.css"></head>
<body class="account-page"><main class="account-card"><img src="/static/churchboard-logo.png" alt="ChurchBoard" class="account-logo"><p class="eyebrow">PRODUCER PLATFORM</p><h1 id="account-title">Sign in</h1><p id="account-intro" class="muted">Use your ChurchBoard account to continue.</p><form id="account-form"><label id="name-label" hidden>Your name<input name="name" autocomplete="name"></label><label id="user-label" hidden>Choose your account<select name="user_email"></select></label><label id="email-label">Email<input name="email" type="email" autocomplete="email" required></label><label id="password-label">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Continue</button><p id="account-status" class="form-status"></p></form><button id="show-recovery" class="link-button" type="button">Lost administrator credentials?</button><form id="recovery-form" hidden><h2>Local administrator recovery</h2><p class="hint">Available only on the computer running ChurchBoard. This turns password sign-in back on.</p><label>Administrator email<input name="email" type="email" required></label><label>New password<input name="password" type="password" required></label><button class="button secondary" type="submit">Reset administrator</button><p id="recovery-status" class="form-status"></p></form><a href="/desktop" class="muted account-back" data-dashboard-back>← Back to boards</a></main><script src="/static/login.js"></script></body></html>
